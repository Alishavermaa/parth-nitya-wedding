/* Layout: one full-height stage over the lotus-and-jasmine backdrop. Scene 1 is a centred layered envelope; scene 2 is a stack of damask cards, each holding a white Mughal arch, with a discreet control bar. Single-theme by design (printed invitation). */
:root{
  color-scheme: light;
  --bg:#F1E7E6;
  --arch:#FFFCF6;
  --ink:#3A2422;
  --muted:#80655F;
  --maroon:#6E1C2A;
  --gold:#A5843F;
  --gold-lite:#D3B97F;
  --env:#E8C3BA;
  --env-lite:#F2D7CF;
  --env-deep:#D7A99F;
  --accent:var(--maroon);
  --script:"Corinthia","Pinyon Script","Snell Roundhand",cursive;
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  /* Type scale: four sizes only */
  --fs-h1:clamp(3rem,14cqw,3.8rem);      /* headings: names, event titles (script) */
  --fs-h2:1.08rem;                       /* sub-headings: dates, times, venue, Save the Date (serif caps) */
  --fs-body:1.14rem;                     /* body: invocation, weekday, notes, lines (serif italic) */
  --fs-label:.7rem;                      /* labels: Day One, Dress code, buttons, controls (serif caps) */
  --deva:"Tiro Devanagari Hindi","Noto Serif Devanagari","Kohinoor Devanagari",serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .24 0 0 0 0 .2 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --fibre:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .09' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .38 0 0 0 0 .3 0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  --ease-out:cubic-bezier(.22,.8,.24,1);
}

/* ---------- envelope scene ---------- */
.scene{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:10}
.env{position:relative;width:min(86vw,380px);max-width:100%;aspect-ratio:1.12/1;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:6px;outline-offset:8px}
.env > *{position:absolute}
.env-back{inset:0;border-radius:6px;z-index:0;
  background:var(--fibre),var(--grain),linear-gradient(170deg,var(--env-lite),var(--env) 55%,var(--env-deep));
  box-shadow:0 1px 1px rgba(90,40,35,.12),0 14px 30px -12px rgba(110,50,45,.45),0 40px 70px -40px rgba(110,50,45,.5)}
.env-lining{inset:3%;border-radius:3px;z-index:1;background:var(--lining) 0 0/88px 88px,#F5E3DC;box-shadow:inset 0 10px 18px -8px rgba(80,30,30,.35)}
.ecard{left:6%;width:88%;top:30%;height:66%;z-index:3}
.pocket-wrap{inset:0;z-index:4;filter:drop-shadow(0 -1.5px 2px rgba(100,45,40,.22));pointer-events:none}
.pocket{position:absolute;inset:0;border-radius:6px;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);
  background:var(--fibre),var(--grain),linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%),linear-gradient(165deg,var(--env-lite),var(--env) 70%,#E0B5AC)}
.pocket svg.folds{position:absolute;inset:0;width:100%;height:100%}
.env-front-text{position:absolute;left:8%;right:8%;bottom:3%;top:66%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;color:var(--maroon)}
.env{container-type:inline-size}
.env-names{font-family:var(--script);font-weight:400;font-size:var(--fs-h1);line-height:.9;margin:0}
.env-sub{color:#6A3A3C}
.env-tap{font-family:var(--serif);font-weight:600;text-transform:uppercase;letter-spacing:.3em;font-size:var(--fs-label);margin:.35em 0 0;padding-left:.3em;color:#7A3F3A;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.flap-wrap{top:0;left:0;right:0;height:61%;z-index:5;filter:drop-shadow(0 2px 2.5px rgba(100,45,40,.28));pointer-events:none}
.flap-wrap.open{z-index:2;filter:none}
.flap{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transform:perspective(1100px) rotateX(0deg);
  background:var(--fibre),var(--grain),linear-gradient(180deg,#EDCBC3,var(--env-lite) 70%,#F5DDD6);border-radius:6px 6px 0 0}
.flap-wrap.open .flap{background:linear-gradient(0deg,rgba(80,30,30,.18),transparent 45%),var(--lining) 0 0/88px 88px,#F5E3DC}
.seal{left:50%;top:54%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(80,50,20,.35))}
.seal svg{width:100%;height:100%;display:block}
.scene.receded{pointer-events:none}

.rim,.arch{position:absolute;-webkit-mask:var(--archTop) top center/100% auto no-repeat,linear-gradient(#000 0 0) 0 var(--archH)/100% 100% no-repeat;
  mask:var(--archTop) top center/100% auto no-repeat,linear-gradient(#000 0 0) 0 var(--archH)/100% 100% no-repeat}
.rim{inset:calc(6cqw - 2.5px) calc(5.4cqw - 2.5px) calc(5.4cqw - 2.5px);--archH:calc(40.4cqw + 2px);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 30%,var(--gold-lite)),var(--gold-lite))}
.arch{inset:6cqw 5.4cqw 5.4cqw;--archH:40.4cqw;background:radial-gradient(120% 60% at 50% 0%,#FFFFFF,transparent 70%),var(--grain),var(--arch)}

/* ---------- deck ---------- */
.deck-layer{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;padding:16px 16px 10px;gap:10px;visibility:hidden;opacity:0}
.deck-layer.show{visibility:visible;opacity:1}
.deck{position:relative;flex:1;min-height:0;width:min(100%,430px);touch-action:pan-y}
.cards{position:absolute;inset:0 16px 20px 0}
.card{position:absolute;inset:0;transition:transform .7s var(--ease-out),opacity .55s ease;will-change:transform}
.card::after{content:"";position:absolute;inset:0;background:transparent;transition:background .5s ease;pointer-events:none;border-radius:inherit}
.card[data-off="1"]{transform:translate(9px,10px) scale(.96) rotate(1deg)}
.card[data-off="2"]{transform:translate(16px,19px) scale(.92) rotate(1.9deg);opacity:.8}
.card[data-off="1"]::after{background:rgba(80,45,40,.07)}
.card[data-off="2"]::after{background:rgba(80,45,40,.13)}
.card[data-off="far"]{transform:translate(16px,19px) scale(.9) rotate(2deg);opacity:0}
.card[data-off="gone"]{transform:translate(-120%,3%) rotate(-7deg);opacity:0}
.card .arch{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.card .arch::-webkit-scrollbar{display:none}
.card-body{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;
  padding:15cqw 8cqw 9cqw;gap:clamp(7px,1.5vh,12px)}

.divider{width:min(64%,190px);height:12px;color:color-mix(in srgb,var(--accent) 40%,var(--gold));flex:none}
.divider svg{width:100%;height:100%;display:block}
.label,.h2,.big-date,.save,.ev-date b,.ev-time,.venue strong{font-family:var(--serif);font-weight:600;text-transform:uppercase;margin:0;color:var(--ink);font-variant-numeric:lining-nums}
.label{font-size:var(--fs-label);letter-spacing:.3em;padding-left:.3em;color:var(--muted)}
.big-date,.save,.ev-date b,.ev-time,.venue strong{font-size:var(--fs-h2);letter-spacing:.18em;padding-left:.18em}
.body,.invocation,.ev-date .wd,.ev-note,.ev-time.note,.venue span,.closing .lead,.env-sub,.ev-dress span:last-child{font-family:var(--serif);font-style:italic;font-weight:500;font-size:var(--fs-body);line-height:1.35;margin:0;letter-spacing:.01em;text-transform:none;padding-left:0}

/* welcome */
.om{font-family:var(--deva);font-size:2.1rem;line-height:1;color:var(--gold);margin:0;text-shadow:0 1px 0 #fff,0 -1px 0 rgba(120,90,40,.2)}
.invocation{color:#87683F;margin-top:-2px}
.save{color:var(--maroon);letter-spacing:.34em;padding-left:.34em}
.names{font-family:var(--script);font-weight:400;color:var(--maroon);margin:0;line-height:.9;font-size:var(--fs-h1);display:flex;flex-direction:column;align-items:center}
.names .amp{color:var(--gold)}
.venue{margin:0;line-height:1.4;display:flex;flex-direction:column;align-items:center}
.venue span{color:var(--muted)}
.ghost-btn{appearance:none;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--gold-lite));background:rgba(255,255,255,.6);
  min-height:46px;padding:10px 22px;border-radius:999px;font-family:var(--serif);font-weight:600;text-transform:uppercase;letter-spacing:.2em;font-size:var(--fs-label);color:var(--accent);white-space:nowrap;
  cursor:pointer;transition:background .25s ease,transform .25s ease;display:inline-flex;align-items:center;gap:.7em}
.ghost-btn:active{transform:scale(.98);background:#fff}
.ghost-btn svg{width:14px;height:14px}
.btn-row{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:6px}
.welcome.revealing .rv{animation:rv .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 95ms)}
@keyframes rv{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* event cards */
.art{display:flex;justify-content:center;align-items:flex-end;flex:none;width:100%}
.art img{display:block;max-width:82%;max-height:clamp(110px,24vh,200px);width:auto;height:auto;object-fit:contain}
.art.wide img{max-width:94%}
.ev-title{font-family:var(--script);font-weight:400;color:var(--accent);margin:0;line-height:.95;font-size:var(--fs-h1);text-wrap:balance}
.ev-date{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.ev-date .wd{color:var(--muted)}
.ev-time{margin-top:2px;color:var(--card-ink,var(--ink))}
.ev-time.note,.ev-note{color:var(--card-ink,var(--ink))}
.ev-dress{margin:4px 0 0;display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:9px 22px;border-radius:999px;
  background:color-mix(in srgb,var(--soft) 30%,transparent);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.ev-dress span:last-child{font-style:normal;font-weight:600;display:inline-flex;align-items:center;gap:.45em}
.swatches{display:inline-flex;gap:3px}
.swatches i{width:8px;height:8px;border-radius:50%}
.closing .lead{max-width:18ch;text-wrap:balance}

/* controls */
.controls{width:min(100%,430px);display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{appearance:none;border:1px solid rgba(165,132,63,.45);background:rgba(255,252,246,.85);min-width:46px;height:46px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:0 12px;cursor:pointer;color:var(--maroon);
  font-family:var(--serif);font-weight:600;text-transform:uppercase;letter-spacing:.24em;font-size:var(--fs-label);transition:opacity .3s ease}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn svg{width:16px;height:16px;flex:none}
.nav-btn .txt{display:none}
@media (min-width:640px){.nav-btn{padding:0 18px}.nav-btn .txt{display:inline}}
.progress{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:6px 12px;border-radius:999px;background:rgba(255,252,246,.6)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:999px;background:rgba(110,28,42,.2);transition:width .4s var(--ease-out),background .4s ease}
.dots i.on{width:18px;background:var(--dot,var(--maroon))}
.progress-text{font-family:var(--serif);font-weight:600;text-transform:uppercase;font-size:var(--fs-label);letter-spacing:.2em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}

.flyer{position:fixed;inset:0;z-index:40;pointer-events:none}
@media (min-width:900px){.deck,.controls{width:450px}}
@media (prefers-reduced-motion: reduce){
  .card{transition:opacity .25s ease}
  .card[data-off="gone"]{transform:none}
  .env-tap{animation:none}
}
</style>

</head>

  <div class="backdrop" aria-hidden="true"></div>

  <section class="scene" id="scene" aria-label="Invitation envelope">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Open the invitation from Parth and Nitya">
      <div class="env-back"></div>
      <div class="env-lining"></div>
      <div class="ecard face" id="ecard" aria-hidden="true"><div class="rim"></div><div class="arch"></div></div>
      <div class="pocket-wrap">
        <div class="pocket">

function flower(cx,cy,r,n,fill,center,rot=0){
  let s="";
  for(let i=0;i<n;i++){const a=rot+i*360/n;s+=`<ellipse cx="${cx}" cy="${R(cy-r*.55)}" rx="${R(r*.36)}" ry="${R(r*.58)}" fill="${fill}" transform="rotate(${R(a)} ${cx} ${cy})"/>`;}
  return s+`<circle cx="${cx}" cy="${cy}" r="${R(r*.24)}" fill="${center}"/>`;
}
function leaf(x,y,len,ang,fill){
  return `<path d="M0 0 Q ${R(len*.5)} ${R(-len*.32)} ${len} 0 Q ${R(len*.5)} ${R(len*.32)} 0 0Z" fill="${fill}" transform="translate(${x} ${y}) rotate(${ang})"/>`;
}
const DIVIDER = `<svg viewBox="0 0 200 12" fill="none" stroke="currentColor"><path d="M10 6 H86 M114 6 H190" stroke-width=".7"/>
  <path d="M100 1 l5 5 -5 5 -5 -5z" fill="currentColor" stroke="none" opacity=".85"/><circle cx="90" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="110" cy="6" r="1.4" fill="currentColor" stroke="none"/></svg>`;
const ARROW = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>`;

(function paintStatic(){
  const css = (k,svg) => document.documentElement.style.setProperty(k, `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`);
  // Mughal arch crown, used as a mask for the white card window (viewBox 100 x 46)
  css("--archTop", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 46"><path d="M0 46 V34 Q0 24 9 24 Q15 24 17.5 28 C17.5 18 25 14 32 14 C40 14 46 8 50 0 C54 8 60 14 68 14 C75 14 82.5 18 82.5 28 Q85 24 91 24 Q100 24 100 34 V46 Z" fill="#000"/></svg>`);
  // envelope lining tile
  css("--lining", `<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88"><rect width="88" height="88" fill="#F6E5DE"/>
    ${leaf(18,22,14,30,"#A7AE8F")}${leaf(18,22,12,120,"#B8BEA2")}${leaf(62,64,14,210,"#A7AE8F")}${leaf(62,64,12,300,"#B8BEA2")}
    ${leaf(70,14,9,60,"#C3C7AD")}${leaf(8,70,9,250,"#C3C7AD")}
    ${flower(18,22,9,5,"#8E3346","#E9C77E",12)}${flower(62,64,10,6,"#D9A09B","#9E4A52",0)}
    ${flower(66,20,5,5,"#E8C3B6","#B8955A",20)}${flower(24,66,5,5,"#E8C3B6","#B8955A",0)}
    <circle cx="44" cy="44" r="2" fill="#C9A66A"/><circle cx="84" cy="40" r="1.5" fill="#C9A66A"/><circle cx="40" cy="84" r="1.5" fill="#C9A66A"/></svg>`);
  // wax seal
  let pts=[];for(let i=0;i<36;i++){const a=i/36*Math.PI*2;const r=46+Math.sin(i*2.7)*2.2+Math.cos(i*1.3)*1.6;pts.push(`${R(50+r*Math.cos(a))},${R(50+r*Math.sin(a))}`);}
  document.getElementById("seal").innerHTML = `<svg viewBox="0 0 100 100"><defs>
    <radialGradient id="wx" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#F1DCA8"/><stop offset=".45" stop-color="#D2AF6C"/><stop offset=".85" stop-color="#A6823F"/><stop offset="1" stop-color="#8B6A30"/></radialGradient>
    <radialGradient id="wx2" cx="60%" cy="65%" r="60%"><stop offset="0" stop-color="#C9A462"/><stop offset="1" stop-color="#DDBE80"/></radialGradient></defs>
    <polygon points="${pts.join(" ")}" fill="url(#wx)"/>
    <circle cx="50" cy="50" r="33" fill="url(#wx2)" stroke="#9C7A3C" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="29" fill="none" stroke="#F3E2B4" stroke-width=".7" stroke-dasharray="1.2 2.4" opacity=".8"/>
    <g font-family="Cormorant Garamond, Garamond, serif" font-weight="600" text-anchor="middle" letter-spacing="1">
      <text x="50.6" y="57.8" font-size="18" fill="#F6E7BE" opacity=".8">P&amp;N</text>
      <text x="50" y="57" font-size="18" fill="#85622A">P&amp;N</text></g>
    <path d="M22 30 q8 -12 22 -14" stroke="#FFF3D0" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/></svg>`;
})();

/* ------------------------- cards ------------------------- */
const W = WEDDING;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shell = (cls, name, style, inner) =>
  `<article class="card face ${cls}" data-name="${esc(name)}" ${style?`style="${style}"`:""}><div class="rim" aria-hidden="true"></div><div class="arch"><div class="card-body">${inner}</div></div></article>`;

function welcomeCard(){
  let i=0; const d=()=>`style="--i:${i++}"`;
  return shell("welcome","Welcome","",`
    <p class="om rv" ${d()} aria-hidden="true">ॐ</p>
    <p class="invocation rv" ${d()}>${esc(W.invocation)}</p>
    <div class="divider rv" ${d()} aria-hidden="true">${DIVIDER}</div>
    <p class="save rv" ${d()}>Save the Date</p>
    <h1 class="names rv" ${d()}><span>${esc(W.couple.a)}</span><span class="amp">&amp;</span><span>${esc(W.couple.b)}</span></h1>
    <div class="divider rv" ${d()} aria-hidden="true">${DIVIDER}</div>
    <p class="big-date rv" ${d()}>${esc(W.dates)}</p>
    <p class="venue rv" ${d()}><strong>${esc(W.venue)}</strong><span>${esc(W.city)}</span></p>
    <div class="btn-row rv" ${d()}><button type="button" class="ghost-btn" data-go="next">Explore the celebrations ${ARROW}</button></div>`);
}
function eventCard(ev){
  const day = W.days[ev.day], t = ev.theme;
  const timeHtml = ev.time ? `<p class="ev-time">${esc(ev.time)}</p>` : (ev.timeNote ? `<p class="ev-time note">${esc(ev.timeNote)}</p>` : "");
  const dress = ev.dress ? `<p class="ev-dress"><span class="label">Dress code</span><span>${ev.swatches?`<span class="swatches" aria-hidden="true">${ev.swatches.map(c=>`<i style="background:${c}"></i>`).join("")}</span>`:""}${esc(ev.dress)}</span></p>` : "";
  return shell("event", ev.title, `--accent:${t.accent};--soft:${t.soft};--card-ink:${t.ink}`, `
    <p class="label">${esc(day.label)}</p>
    <div class="art${ev.wide?" wide":""}"><img src="${ART_SRC[ev.art]}" alt="" decoding="async"></div>
    <h2 class="ev-title">${esc(ev.title).replace(" - ","\u00a0- ")}</h2>
    <div class="divider" aria-hidden="true">${DIVIDER}</div>
    <p class="ev-date"><span class="wd">${esc(day.weekday)}</span><b>${esc(day.date)}</b></p>
    ${timeHtml}
    ${ev.note ? `<p class="ev-note">${esc(ev.note)}</p>` : ""}
    ${dress}
`);
}
function closingCard(){
  return shell("closing","With love","",`
    <p class="om" aria-hidden="true">ॐ</p>
    <p class="lead">We can’t wait to celebrate with you.</p>
    <div class="divider" aria-hidden="true">${DIVIDER}</div>
    <p class="names"><span>${esc(W.couple.a)}</span><span class="amp">&amp;</span><span>${esc(W.couple.b)}</span></p>
    <p class="big-date">${esc(W.dates)}</p>
    <p class="venue"><strong>${esc(W.venue)}</strong><span>${esc(W.city)}</span></p>
    <div class="btn-row">
      <button type="button" class="ghost-btn" data-go="first-event">View celebrations again</button>
      <button type="button" class="ghost-btn" data-go="replay">Replay envelope opening</button>
    </div>`);
}

const cardsEl = document.getElementById("cards");
cardsEl.innerHTML = welcomeCard() + W.events.map(eventCard).join("") + closingCard();
const cards = [...cardsEl.children];
const dotsEl = document.getElementById("dots");
dotsEl.innerHTML = cards.map(()=>"<i></i>").join("");
const dots = [...dotsEl.children];
const prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
cards.forEach((c,i)=>{ c.setAttribute("role","group"); c.setAttribute("aria-roledescription","card"); c.setAttribute("aria-label",`${c.dataset.name}, ${i+1} of ${cards.length}`); });
const scroller = c => c.querySelector(".arch");

let cur = 0;
function render(){
  cards.forEach((c,i)=>{
    const off = i-cur;
    c.dataset.off = off<0 ? "gone" : off===0 ? "0" : off<=2 ? String(off) : "far";
    c.style.zIndex = off<0 ? 250+off : 300-off;
    const active = off===0;
    c.inert = !active; c.setAttribute("aria-hidden", active ? "false" : "true");
  });
  dots.forEach((d,i)=>d.classList.toggle("on",i===cur));
  const accent = getComputedStyle(cards[cur]).getPropertyValue("--accent").trim();
  dotsEl.style.setProperty("--dot", accent || "#6E1C2A");
  prevBtn.disabled = cur===0; nextBtn.disabled = cur===cards.length-1;
  progressText.textContent = cur===0 ? "Welcome" : cur===cards.length-1 ? "With love" : cards[cur].dataset.name;
}
function go(i){
  i = Math.max(0, Math.min(cards.length-1, i));
  if(i===cur) return render();
  cur = i; render();
  scroller(cards[cur]).scrollTop = 0;
}
prevBtn.addEventListener("click",()=>go(cur-1));
nextBtn.addEventListener("click",()=>go(cur+1));
cardsEl.addEventListener("click",e=>{
  const b = e.target.closest("[data-go]"); if(!b) return;
  const k = b.dataset.go;
  if(k==="next") go(cur+1);
  else if(k==="first-event") go(1);
  else if(k==="replay") replay();
});
document.addEventListener("keydown",e=>{
  if(!state.opened) return;
  if(e.key==="ArrowRight"){ go(cur+1); e.preventDefault(); }
  if(e.key==="ArrowLeft"){ go(cur-1); e.preventDefault(); }
});

/* swipe (touch & pen; mouse keeps text selectable and uses the buttons) */
(function swipe(){
  const deck = document.getElementById("deck");
  let sx=0, sy=0, dx=0, mode=null, id=null, el=null;
  deck.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse" || !state.opened) return;
    if(e.target.closest("button")) return;
    sx=e.clientX; sy=e.clientY; dx=0; mode=null; id=e.pointerId; el=cards[cur];
  });
  deck.addEventListener("pointermove",e=>{
    if(e.pointerId!==id || !el) return;
    const mx=e.clientX-sx, my=e.clientY-sy;
    if(!mode){
      if(Math.abs(mx)>9 && Math.abs(mx)>Math.abs(my)*1.2){ mode="x"; deck.setPointerCapture(id); el.style.transition="none"; }
      else if(Math.abs(my)>9){ mode="y"; }
    }
    if(mode==="x"){
      dx = mx;
      const edge = (dx>0 && cur===0) || (dx<0 && cur===cards.length-1);
      const d = edge ? dx*.25 : dx;
      el.style.transform = `translateX(${d}px) rotate(${d*.02}deg)`;
    }
  });
  const end = e=>{
    if(e.pointerId!==id) return;
    if(mode==="x" && el){
      el.style.transition=""; el.style.transform="";
      if(dx<-60) go(cur+1); else if(dx>60) go(cur-1);
    }
    id=null; mode=null; el=null;
  };
  deck.addEventListener("pointerup",end);
  deck.addEventListener("pointercancel",end);
})();

/* ------------------------- envelope sequence ------------------------- */
const $ = id => document.getElementById(id);
const env=$("env"), scene=$("scene"), seal=$("seal"), flap=$("flap"), flapWrap=$("flapWrap"), ecard=$("ecard"),
      frontText=$("frontText"), deckLayer=$("deckLayer"), controls=$("controls"), flyer=$("flyer"), pocketWrap=env.querySelector(".pocket-wrap");
const state = { opening:false, opened:false };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r=>setTimeout(r,ms));
const welcome = cards[0];

function showDeck(){
  deckLayer.inert = false;
  deckLayer.classList.add("show");
  state.opened = true; state.opening = false;
}

async function openEnvelope(){
  if(state.opening || state.opened) return;
  state.opening = true;
  cur = 0; render();

  if(reduced()){
    await env.animate([{opacity:1},{opacity:0}],{duration:300,fill:"forwards"}).finished;
    scene.classList.add("receded");
    deckLayer.animate([{opacity:0},{opacity:1}],{duration:300});
    showDeck(); $("deck").focus({preventScroll:true});
    return;
  }

  // 1. seal lifts and fades
  seal.animate([
    {transform:"translate(-50%,-50%) scale(1)",opacity:1},
    {transform:"translate(-50%,-64%) scale(1.07)",opacity:1,offset:.4},
    {transform:"translate(-50%,-82%) scale(1.03)",opacity:0}
  ],{duration:560,easing:"cubic-bezier(.3,.6,.3,1)",fill:"forwards"});
  frontText.animate([{opacity:1},{opacity:.55}],{duration:500,fill:"forwards"});
  await wait(280);

  // 2. flap unfolds backwards; swap layering once it passes vertical
  const flapAnim = flap.animate([
    {transform:"perspective(1100px) rotateX(0deg)"},
    {transform:"perspective(1100px) rotateX(180deg)"}
  ],{duration:740,easing:"ease-in-out",fill:"forwards"});
  setTimeout(()=>flapWrap.classList.add("open"), 370);
  await flapAnim.finished;

  // 3. card rises out of the pocket while the envelope settles lower
  const eh = env.getBoundingClientRect().height;
  env.animate([{transform:"translateY(0)"},{transform:`translateY(${eh*0.22}px)`}],{duration:1000,easing:"cubic-bezier(.45,.05,.3,1)",fill:"forwards"});
  await ecard.animate([{transform:"translateY(0)"},{transform:`translateY(${-eh*0.93}px)`}],{duration:1000,easing:"cubic-bezier(.45,.05,.3,1)",fill:"forwards"}).finished;

  // 4. lift the card clear, bring it forward and enlarge into reading position
  const from = ecard.getBoundingClientRect();
  const to = welcome.getBoundingClientRect();
  flyer.appendChild(ecard);
  ecard.getAnimations().forEach(a=>a.cancel());
  Object.assign(ecard.style,{position:"fixed",left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px",margin:0});
  env.getAnimations().forEach(a=>{ a.commitStyles?.(); a.cancel(); });
  env.animate([{transform:env.style.transform||"none",opacity:1,filter:"blur(0)"},
               {transform:`translateY(${eh*0.42}px) scale(.8)`,opacity:.25,filter:"blur(1px)"}],{duration:950,easing:"cubic-bezier(.3,.7,.2,1)",fill:"forwards"});
  scene.classList.add("receded");
  await ecard.animate([
    {left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px"},
    {left:to.left+"px",top:to.top+"px",width:to.width+"px",height:to.height+"px"}
  ],{duration:900,easing:"cubic-bezier(.3,.7,.2,1)",fill:"forwards"}).finished;

  // 5. hand over to the real card and reveal the text
  welcome.classList.add("revealing");
  showDeck();
  ecard.hidden = true;
  cards.slice(1,3).forEach(c=>c.animate([{opacity:0},{opacity:getComputedStyle(c).opacity}],{duration:600,delay:500,fill:"backwards"}));
  controls.animate([{opacity:0},{opacity:1}],{duration:600,delay:700,fill:"backwards"});
  $("deck").focus({preventScroll:true});
  setTimeout(()=>welcome.classList.remove("revealing"), 1900);
}

function resetEnvelope(){
  [seal,flap,frontText,env,ecard].forEach(n=>n.getAnimations().forEach(a=>a.cancel()));
  env.style.transform = ""; flapWrap.classList.remove("open");
  ecard.removeAttribute("style"); ecard.hidden = false;
  env.insertBefore(ecard, pocketWrap);
  scene.classList.remove("receded");
}
async function replay(){
  deckLayer.classList.remove("show"); deckLayer.inert = true;
  welcome.classList.remove("revealing");
  state.opened = false; state.opening = false;
  resetEnvelope();
  cur = 0; render();
  env.animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:500,easing:"ease-out"});
  env.focus({preventScroll:true});
  await wait(reduced() ? 400 : 900);
  openEnvelope();
}

env.addEventListener("click", openEnvelope);
env.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openEnvelope(); } });
render();
</script>
